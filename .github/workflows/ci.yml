name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # Rules read git history (last 30 commits, per-author medians), so tests need it.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Test helpers create commits in temp repos; runners have no git identity by default.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version

  dogfood:
    name: dogfood (action on its own diff)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # Runs this repo's action.yml against this PR/push using the fresh build, so both the
      # CLI and the action are exercised. Report-only: no fail-on.
      - id: risk
        uses: ./
        with:
          cli: dist/cli.js
      - run: test "${{ steps.risk.outputs.exit-code }}" = "0"

  compile:
    name: bun single-binary build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - run: bun build src/cli.ts --compile --minify --target=bun-linux-x64 --outfile out/risk-annotate
      - name: Binary matches the Node build
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          ./out/risk-annotate --version
          ./out/risk-annotate --format json > bin.json
          npm ci && npm run build
          node dist/cli.js --format json > node.json
          diff node.json bin.json

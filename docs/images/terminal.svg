<svg xmlns="http://www.w3.org/2000/svg" width="998" height="686" viewBox="0 0 998 686" role="img" aria-label="risk-annotate output: one annotated line per risky hunk, and exit code 2 with --fail-on high">
  <rect width="998" height="686" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h978a10 10 0 0 1 10 10v22H0z" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="499" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">risk-annotate — agent change under review</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="24" y="68" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3" font-weight="700">npx risk-annotate</tspan></text>
    <text x="24" y="89" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700"># Risk annotations</tspan></text>
    <text x="24" y="120.5" xml:space="preserve"><tspan fill="#8b949e">`HEAD~1..HEAD` · 7 files · 3 HIGH · 3 MED · 1 LOW</tspan></text>
    <text x="24" y="152" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">## `src/a.test.ts`</tspan></text>
    <text x="24" y="183.5" xml:space="preserve"><tspan fill="#8b949e">- L1-1: </tspan><tspan fill="#ff7b72" font-weight="700">[HIGH]</tspan><tspan fill="#e6edf3"> Removes 2 test lines; confirm coverage was not dropped to make the suite pass </tspan><tspan fill="#8b949e">(path heuristic)</tspan></text>
    <text x="24" y="215" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">## `src/a.ts`</tspan></text>
    <text x="24" y="246.5" xml:space="preserve"><tspan fill="#8b949e">- L5-5: </tspan><tspan fill="#ff7b72" font-weight="700">[HIGH]</tspan><tspan fill="#e6edf3"> File was in fix/revert commit 9666a75 within the last 5 commits; it has regressed before </tspan><tspan fill="#8b949e">(git log)</tspan></text>
    <text x="24" y="278" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">## `src/auth/login.ts`</tspan></text>
    <text x="24" y="309.5" xml:space="preserve"><tspan fill="#8b949e">- L5-5: </tspan><tspan fill="#ff7b72" font-weight="700">[HIGH]</tspan><tspan fill="#e6edf3"> Touches auth code; check session, token and permission handling </tspan><tspan fill="#8b949e">(path heuristic)</tspan></text>
    <text x="24" y="341" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">## `.github/workflows/ci.yml`</tspan></text>
    <text x="24" y="372.5" xml:space="preserve"><tspan fill="#8b949e">- L1-1: </tspan><tspan fill="#e3b341" font-weight="700">[MED]</tspan><tspan fill="#e6edf3"> CI workflow changed; check permissions, secret usage and triggers </tspan><tspan fill="#8b949e">(path heuristic)</tspan></text>
    <text x="24" y="404" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">## `package.json`</tspan></text>
    <text x="24" y="435.5" xml:space="preserve"><tspan fill="#8b949e">- L5-6: </tspan><tspan fill="#e3b341" font-weight="700">[MED]</tspan><tspan fill="#e6edf3"> Adds new dependency "zod"; review provenance, license and maintenance </tspan><tspan fill="#8b949e">(dependency manifest)</tspan></text>
    <text x="24" y="467" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">## `src/uncovered.ts`</tspan></text>
    <text x="24" y="498.5" xml:space="preserve"><tspan fill="#8b949e">- L3-3: </tspan><tspan fill="#e3b341" font-weight="700">[MED]</tspan><tspan fill="#e6edf3"> Changes a file with 0% test coverage; no test exercises these lines </tspan><tspan fill="#8b949e">(coverage report)</tspan></text>
    <text x="24" y="530" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">## `src/big.ts`</tspan></text>
    <text x="24" y="561.5" xml:space="preserve"><tspan fill="#8b949e">- L1-20: </tspan><tspan fill="#79c0ff" font-weight="700">[LOW]</tspan><tspan fill="#e6edf3"> Diff is 32 lines, 8.0x this author's median of 4 over 5 commits; consider splitting </tspan><tspan fill="#8b949e">(commit size)</tspan></text>
    <text x="24" y="593" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3" font-weight="700">npx risk-annotate --fail-on high --format sarif &gt; risk.sarif</tspan></text>
    <text x="24" y="614" xml:space="preserve"><tspan fill="#ff7b72">risk-annotate: found annotations at or above HIGH</tspan></text>
    <text x="24" y="635" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3" font-weight="700">echo $?</tspan></text>
    <text x="24" y="656" xml:space="preserve"><tspan fill="#e6edf3">2</tspan></text>
  </g>
</svg>
